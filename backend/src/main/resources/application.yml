spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/documind}
    username: ${DATABASE_USER:documind}
    password: ${DATABASE_PASSWORD}
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}
      embedding:
        options:
          model: text-embedding-3-small
          dimensions: 1536
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${SECURE_COOKIE:false}
  error:
    include-message: never
